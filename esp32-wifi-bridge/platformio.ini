[platformio]
; Bare `pio run` / `pio run -t upload` uses only the USB env, not the OTA env.
default_envs = seeed_xiao_esp32c3

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
; Two OTA app slots (see partitions_ota.csv). The FIRST flash after switching to
; this table must be over USB - it rewrites the bootloader + partition table.
board_build.partitions = partitions_ota.csv

[env:seeed_xiao_esp32c3]
; Default target: USB / serial upload.
;   pio run -t upload
;   pio run -t upload -t monitor

[env:ota]
; Wireless self-update of the running flasher over HTTP (see ota_post_handler).
;   pio run -e ota -t upload
; The flasher speaks a plain HTTP POST, not ArduinoOTA/espota - so this is a
; `custom` protocol. The host must NOT go in `upload_port` (PlatformIO would then
; force `upload_protocol = espota` and warn); it lives in `custom_ota_host`.
; Edit it to the flasher's IP (a DHCP reservation keeps it stable). The token
; must match OTA_TOKEN in src/secrets.h (see custom_ota_token below).
upload_protocol = custom
custom_ota_host = 192.168.1.50   ; <- your bridge's IP (a DHCP reservation keeps it stable)
; The OTA token is read from the GATE_OTA_TOKEN environment variable so it
; never lives in this file. It must match OTA_TOKEN in src/secrets.h.
custom_ota_token = ${sysenv.GATE_OTA_TOKEN}
upload_command = curl -# -S --fail -X POST --data-binary @$SOURCE "http://${this.custom_ota_host}/ota?token=${this.custom_ota_token}"
